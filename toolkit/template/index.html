<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W=1920,H=1080,FPS=30,BAR=2.1258,bar=b=>(b-1)*BAR,END=bar(53);
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const SERIF='"Noto Serif CJK SC", serif',SANS='"Noto Sans CJK SC", sans-serif';
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3);
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const win=(t,a,b,fi=.35,fo=.35)=>Math.min(seg(t,a,a+fi),1-seg(t,b-fo,b));
const lerp=(a,b,k)=>a+(b-a)*k;
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixc=(a,b,k)=>{const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],k))).join(',')})`;};
const YEL='#ffd21f',CREAM='#efe8da';
function T(s,x,y,size,{a=1,color='#fff',weight=700,align='center',glow=0,glowColor=null,font=SANS,spacing=0}={}){
  if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.font=`${weight} ${size}px ${font}`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.letterSpacing=spacing+'px';
  if(glow){ctx.shadowColor=glowColor||color;ctx.shadowBlur=glow;}ctx.fillStyle=color;ctx.fillText(s,x,y);ctx.restore();}
function pop(t,t0,cx,cy,fn,amt=.3,d=.35){const k=eOut(seg(t,t0,t0+d));ctx.save();ctx.translate(cx,cy);const s=1+amt*(1-k);ctx.scale(s,s);ctx.translate(-cx,-cy);fn(k);ctx.restore();}

// ---------- formatting ----------
function fmtLen(m){
  if(m<0.01){const mm=m*1000;return (mm<10?mm.toFixed(1):mm.toFixed(0))+' 毫米';}
  if(m<1)return (m*100).toFixed(1)+' 厘米';
  if(m<1000)return m.toFixed(0)+' 米';
  const km=m/1000;if(km<1e4)return Math.round(km).toLocaleString('en')+' 公里';
  const ly=m/9.4607e15;
  if(ly<0.5){const w=km/1e4;return (w<1e4?Math.round(w).toLocaleString('en')+' 万公里':(km/1e8).toFixed(km<1e9?1:0)+' 亿公里');}
  if(ly<1e4)return ly.toFixed(ly<10?1:0)+' 光年';
  if(ly<1e8)return Math.round(ly/1e4).toLocaleString('en')+' 万光年';
  return Math.round(ly/1e8).toLocaleString('en')+' 亿光年';}
function fmtCN(n){if(n<1e4)return Math.round(n).toLocaleString('en');if(n<1e8)return Math.round(n/1e4).toLocaleString('en')+' 万';if(n<1e16)return Math.round(n/1e8).toLocaleString('en')+' 亿';return Math.round(n/1e16).toLocaleString('en')+' 亿亿';}

// ---------- assets ----------
const grain=[];for(let g=0;g<4;g++){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const im=x.createImageData(256,256);const gr=rng(500+g);
 for(let i=0;i<im.data.length;i+=4){const v=gr()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}x.putImageData(im,0,0);grain.push(ctx.createPattern(c,'repeat'));}
const RS=rng(8);const stars=Array.from({length:900},()=>({x:RS()*W,y:RS()*H,r:.4+Math.pow(RS(),3)*2.2,p:RS()*6.28,c:RS()<.2?'#ffd9a8':RS()<.4?'#b8ccff':'#fff'}));
const streaks=Array.from({length:140},()=>({x:RS()*W,y:RS()*H,l:60+RS()*260,w:1+RS()*2.5,s:.6+RS()*.8}));
const nebula=(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),r=rng(19);
  for(let i=0;i<260;i++){const px=r()*W,py=r()*H,rad=80+r()*260,col=['120,60,255','255,60,160','40,160,255','255,140,60'][Math.floor(r()*4)];const g=x.createRadialGradient(px,py,0,px,py,rad);g.addColorStop(0,`rgba(${col},.07)`);g.addColorStop(1,`rgba(${col},0)`);x.fillStyle=g;x.fillRect(px-rad,py-rad,rad*2,rad*2);}return c;})();
const galaxy=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),r=rng(23);x.translate(128,128);
  for(let i=0;i<1600;i++){const arm=i%2,d=Math.pow(r(),.6)*118,an=d*.05+arm*Math.PI+(r()-.5)*.6;x.fillStyle=`rgba(${200+r()*55},${190+r()*50},255,${.25+r()*.5})`;x.fillRect(Math.cos(an)*d,Math.sin(an)*d*.45,1.4,1.4);}
  const g=x.createRadialGradient(0,0,0,0,0,40);g.addColorStop(0,'rgba(255,240,210,.9)');g.addColorStop(1,'rgba(255,240,210,0)');x.fillStyle=g;x.fillRect(-40,-40,80,80);return c;})();
const moonTex=(()=>{const c=document.createElement('canvas');c.width=c.height=520;const x=c.getContext('2d'),r=rng(31);const g=x.createRadialGradient(200,200,40,260,260,260);g.addColorStop(0,'#f2f0ea');g.addColorStop(.7,'#c9c6be');g.addColorStop(1,'#8d8a84');
  x.fillStyle=g;x.beginPath();x.arc(260,260,258,0,6.283);x.fill();x.save();x.clip();
  for(let i=0;i<14;i++){x.fillStyle=`rgba(110,108,104,${.18+r()*.2})`;x.beginPath();x.ellipse(60+r()*400,60+r()*400,30+r()*90,20+r()*70,r()*3,0,6.283);x.fill();}
  for(let i=0;i<90;i++){const px=r()*520,py=r()*520,rad=3+Math.pow(r(),2)*22;x.strokeStyle='rgba(80,78,74,.14)';x.lineWidth=2;x.beginPath();x.arc(px,py,rad,0,6.283);x.stroke();x.fillStyle='rgba(255,255,255,.05)';x.beginPath();x.arc(px-rad*.2,py-rad*.2,rad*.7,0,6.283);x.fill();}
  x.restore();return c;})();

// ================= CALM: the desk =================
const PXMM=5,BASEY=800,DESKX=W/2;
const FOLD0=3.2,FSTEP=1.3,FDUR=.7;
const foldT=k=>FOLD0+(k-1)*FSTEP;
function desk(t,dim=0){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a2723');g.addColorStop(.62,'#3b362f');g.addColorStop(.74,'#6d6152');g.addColorStop(1,'#4a4137');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=.12;ctx.strokeStyle='#2a221b';ctx.lineWidth=2;for(let i=0;i<9;i++){const y=BASEY+18+i*32;ctx.beginPath();ctx.moveTo(0,y);for(let x=0;x<=W;x+=40)ctx.lineTo(x,y+Math.sin(x*.004+i)*6);ctx.stroke();}ctx.restore();
  const l=ctx.createRadialGradient(DESKX,BASEY-120,40,DESKX,BASEY-120,900);l.addColorStop(0,'rgba(255,236,200,.22)');l.addColorStop(1,'rgba(255,236,200,0)');ctx.fillStyle=l;ctx.fillRect(0,0,W,H);
  if(dim>0){ctx.fillStyle=`rgba(0,0,0,${dim})`;ctx.fillRect(0,0,W,H);}}
function paperStack(x,len,thPx,a=1){if(a<=0)return;ctx.save();ctx.globalAlpha=a;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x,BASEY+4,len*.55,10,0,0,6.283);ctx.fill();
  const th=Math.max(thPx,1.2);const g=ctx.createLinearGradient(0,BASEY-th,0,BASEY);g.addColorStop(0,'#fbf8f1');g.addColorStop(1,'#d9d3c6');ctx.fillStyle=g;ctx.fillRect(x-len/2,BASEY-th,len,th);
  if(th>14){ctx.globalAlpha=a*.18;ctx.strokeStyle='#9c9384';ctx.lineWidth=1;const n=Math.min(64,Math.floor(th/3));for(let i=1;i<n;i++){const y=BASEY-th*i/n;ctx.beginPath();ctx.moveTo(x-len/2,y);ctx.lineTo(x+len/2,y);ctx.stroke();}}
  ctx.restore();}
function stackLen(k){return Math.max(300,1000/Math.pow(2,k));}
function calmFold(t,maxK=10){
  let k=0;for(let i=1;i<=maxK;i++)if(t>=foldT(i)+FDUR)k=i;
  const cur=k+1,ft=foldT(cur),p=(cur<=maxK&&t>=ft)?eInOut(seg(t,ft,ft+FDUR)):0;
  const th=1e-1*Math.pow(2,k)*PXMM;
  if(p>0){const len=stackLen(k),half=len/2;
    paperStack(DESKX-half/2,half,th);
    ctx.save();ctx.translate(DESKX,BASEY-th);ctx.rotate(-Math.PI*p);const tt=Math.max(th,1.2);
    const g=ctx.createLinearGradient(0,0,0,tt);g.addColorStop(0,'#e2dccf');g.addColorStop(1,'#fffdf8');ctx.fillStyle=g;ctx.fillRect(0,0,half,tt);ctx.restore();
  } else if(k>0){const prev=stackLen(k-1),q=eOut(seg(t,foldT(k)+FDUR,foldT(k)+FDUR+.35));
    paperStack(lerp(DESKX-prev/4,DESKX,q),lerp(prev/2,stackLen(k),q),th);}
  else paperStack(DESKX,stackLen(0),th);
  return {k,th};}
function sceneCalm(t){if(t>=bar(9))return;
  const dim=eInOut(seg(t,16.25,16.95))*.93;desk(t,0);
  const {k}=calmFold(t,10);
  // HUD
  const hud=1-seg(t,15.5,16.0);
  T(k?`第 ${k} 次`:'',220,330,40,{a:hud*.85,color:'#cfc6b6',font:SERIF,weight:500,align:'left'});
  T(fmtLen(1e-4*Math.pow(2,k)),W-220,330,40,{a:hud*.85,color:'#cfc6b6',font:SERIF,weight:500,align:'right'});
  const hint=k>=10?'≈ 一只手掌':k>=7?'≈ 一枚硬币摞起来':k>=3?'≈ 一张银行卡':'';
  T(hint,W-220,385,26,{a:hud*.6*seg(t,foldT(Math.max(k,1))+FDUR,foldT(Math.max(k,1))+FDUR+.3),color:'#a99f8e',font:SERIF,weight:500,align:'right'});
  // ruler on the left of the stack
  ctx.save();ctx.globalAlpha=hud*.35;ctx.strokeStyle='#d8cfbf';ctx.lineWidth=1;ctx.beginPath();const rx=DESKX-340;ctx.moveTo(rx,BASEY);ctx.lineTo(rx,BASEY-540);
  for(let mm=0;mm<=105;mm+=5){const y=BASEY-mm*PXMM;ctx.moveTo(rx,y);ctx.lineTo(rx+(mm%10?8:16),y);}ctx.stroke();ctx.restore();
  T('10 cm',DESKX-360,BASEY-100*PXMM,20,{a:hud*.35,color:'#d8cfbf',font:SERIF,weight:500,align:'right'});
  T('那么，折 42 次呢？',W/2,250,46,{a:window.COVER?0:win(t,15.5,16.95,.4,.35),color:CREAM,font:SERIF,weight:500,spacing:4});
  if(dim>0){ctx.fillStyle=`rgba(0,0,0,${dim})`;ctx.fillRect(0,0,W,H);}}

// ================= EXPLOSION: log-scale rocket camera =================
const TOPY=330,PD=210;
const M1=[[1.7,'一个人','1.7 米'],[632,'上海中心大厦','632 米'],[8849,'珠穆朗玛峰','8,849 米'],[1e5,'太空边界','100 公里'],[4e5,'空间站轨道','约 400 公里'],[3.5786e7,'同步卫星','约 3.6 万公里']];
const M2=[[1.496e11,'太阳','1.5 亿公里'],[4.0e16,'比邻星','4.2 光年'],[9.5e20,'银河系直径','约 10 万光年'],[2.4e22,'仙女座星系','约 250 万光年']];
function rocket(t,n,{markers,shake,flash,phase}){
  const h=1e-4*Math.pow(2,n),L=Math.log10(h);
  const sx=(Math.sin(t*93)+Math.sin(t*57))*shake,sy=(Math.cos(t*71)+Math.sin(t*39))*shake;ctx.save();ctx.translate(sx,sy);
  // sky -> space
  const k=clamp((L-1.5)/5);
  if(phase===1){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,mixc('#0b6bff','#000006',k));g.addColorStop(1,mixc('#7fd0ff','#04061a',k));ctx.fillStyle=g;ctx.fillRect(-40,-40,W+80,H+80);}
  else{ctx.fillStyle='#02010a';ctx.fillRect(-40,-40,W+80,H+80);ctx.globalAlpha=clamp((L-10)/4);ctx.drawImage(nebula,0,0);ctx.globalAlpha=1;}
  const sa=phase===1?clamp((L-4.2)/1.5):1;
  if(sa>0){ctx.save();stars.forEach(s=>{const y=(s.y+t*40)%H;ctx.globalAlpha=sa*(.5+.5*Math.sin(t*2+s.p*4));ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.x,y,s.r,0,6.283);ctx.fill();});ctx.restore();}
  if(phase===2){const gk=clamp((L-19)/3);for(let i=0;i<7;i++){const r=rng(400+i);const gx=r()*W,gy=((r()*H+t*120*(1+i%3))%(H+300))-150;ctx.save();ctx.globalAlpha=gk*.85;ctx.translate(gx,gy);ctx.rotate(r()*3);const s=80+r()*160;ctx.drawImage(galaxy,-s,-s,s*2,s*2);ctx.restore();}}
  // Earth receding (phase 1)
  if(phase===1&&L>3.3){const er=lerp(5200,180,clamp((L-3.3)/4.5));ctx.save();ctx.globalAlpha=clamp((L-3.3)/.6);const ex=W/2,ey=H+er-lerp(140,0,clamp((L-5)/3));
    const g=ctx.createRadialGradient(ex-er*.3,ey-er*.4,er*.1,ex,ey,er);g.addColorStop(0,'#5fb4ff');g.addColorStop(.8,'#1a5bd6');g.addColorStop(1,'#0a2a7a');ctx.fillStyle=g;ctx.beginPath();ctx.arc(ex,ey,er,0,6.283);ctx.fill();
    ctx.strokeStyle='rgba(140,210,255,.8)';ctx.lineWidth=8;ctx.shadowColor='#8fd4ff';ctx.shadowBlur=30;ctx.beginPath();ctx.arc(ex,ey,er,0,6.283);ctx.stroke();ctx.restore();}
  // speed streaks
  ctx.save();const sp=clamp(phase?1:0);streaks.forEach(s=>{const y=((s.y+t*2400*s.s)%(H+400))-200;ctx.globalAlpha=.25*sp;ctx.fillStyle=phase===1&&L<4?'#ffffff':'#bfe1ff';ctx.fillRect(s.x,y,s.w,s.l);});ctx.restore();
  // markers
  markers.forEach(([alt,name,val])=>{const y=TOPY+(L-Math.log10(alt))*PD;if(y<-60||y>H+60)return;const passed=h>=alt;
    ctx.save();ctx.globalAlpha=.9;ctx.strokeStyle=passed?'rgba(255,255,255,.55)':'rgba(255,255,255,.3)';ctx.setLineDash([14,12]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2+90,y);ctx.lineTo(W-120,y);ctx.stroke();ctx.restore();
    if(!window.COVER)T(name,W-120,y-26,34,{color:'#fff',weight:900,align:'right'});if(!window.COVER)T(val,W-120,y+24,24,{color:passed?YEL:'rgba(255,255,255,.7)',weight:700,align:'right'});});
  // paper column
  const cg=ctx.createLinearGradient(W/2-70,0,W/2+70,0);cg.addColorStop(0,'#cfd8e6');cg.addColorStop(.5,'#ffffff');cg.addColorStop(1,'#cfd8e6');
  ctx.save();ctx.shadowColor=phase===1?'#ffffff':'#d8c8ff';ctx.shadowBlur=60;ctx.fillStyle=cg;ctx.fillRect(W/2-60,TOPY,120,H-TOPY+60);ctx.restore();
  ctx.save();ctx.globalAlpha=.25;ctx.fillStyle='#7c8aa3';for(let i=0;i<40;i++){const y=TOPY+((i*37+t*900)%(H-TOPY+40));ctx.fillRect(W/2-60,y,120,2);}ctx.restore();
  const tg=ctx.createRadialGradient(W/2,TOPY,0,W/2,TOPY,220);tg.addColorStop(0,'rgba(255,255,255,.9)');tg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=tg;ctx.fillRect(W/2-220,TOPY-220,440,440);
  ctx.restore();
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash})`;ctx.fillRect(0,0,W,H);}
  return h;}
function counter(t,n,h,a=1){if(window.COVER)return;const nn=Math.floor(n);
  T('第',150,450,54,{a,color:'#fff',weight:900,align:'left'});
  T(String(nn),220,560,230,{a,color:YEL,weight:900,align:'left',glow:30,glowColor:'rgba(255,200,0,.5)'});
  T('次对折',160,700,48,{a,color:'#fff',weight:900,align:'left'});
  T(fmtLen(h),150,790,52,{a,color:'#fff',weight:900,align:'left',glow:16,glowColor:'rgba(0,0,0,.6)'});}
const X1=bar(9),X1e=22.9;
function sceneBoom1(t){if(t<X1||t>=bar(15)+.05)return;
  const p=seg(t,X1,X1e),n=10+32*(1-Math.pow(1-p,2.2));
  const shake=22*(1-seg(t,X1,X1+.9))+5*(p<1?1:0)+16*(t>=X1e?1-seg(t,X1e,X1e+.7):0);
  const flash=Math.max(1-seg(t,X1,X1+.45),t>=X1e?.85*(1-seg(t,X1e,X1e+.6)):0);
  const h=rocket(t,n,{markers:M1,shake,flash:0,phase:1});
  // moon
  const L=Math.log10(h),my=TOPY+(L-Math.log10(3.844e8))*PD;const mr=lerp(120,330,clamp((L-7)/1.6));
  if(my<H+400){const cy=Math.min(my,TOPY)-mr*.86;ctx.save();ctx.shadowColor='rgba(255,255,255,.5)';ctx.shadowBlur=60;ctx.drawImage(moonTex,W/2-mr,cy-mr,mr*2,mr*2);ctx.restore();
    if(!window.COVER)T('月球',W/2+mr+40,cy-20,40,{color:'#fff',weight:900,align:'left'});if(!window.COVER)T('约 38.4 万公里',W/2+mr+40,cy+30,26,{color:YEL,weight:700,align:'left'});}
  counter(t,n,h,1-seg(t,bar(15)-.4,bar(15)));
  const A=seg(t,X1e,X1e+.25)*(1-seg(t,bar(15)-.4,bar(15)));
  pop(t,X1e,W/2+330,810,k=>T('已经超过月球',W/2+330,810,64,{a:A,color:'#fff',weight:900,glow:24,glowColor:'rgba(0,0,0,.8)'}),.4);
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash})`;ctx.fillRect(0,0,W,H);}
  if(t>=bar(15)-.4){ctx.fillStyle=`rgba(6,10,30,${seg(t,bar(15)-.4,bar(15))})`;ctx.fillRect(0,0,W,H);}}

// ================= GRAPH: the last 10 folds =================
function sceneGraph(t){const t0=bar(15),t1=bar(23);if(t<t0-.05||t>=t1+.05)return;
  const a=Math.min(seg(t,t0-.05,t0+.4),1-seg(t,t1-.4,t1));ctx.fillStyle='#060a1e';ctx.fillRect(0,0,W,H);
  const x0=200,x1=1720,base=760,top=250,bw=(x1-x0)/42;const maxH=1e-4*Math.pow(2,42);
  T('每一次对折后的厚度',x0,200,30,{a:a*.75,color:'#9fb0d8',weight:500,align:'left'});
  const hl=seg(t,bar(18),bar(18)+.4);
  for(let i=1;i<=42;i++){const appear=seg(t,t0+.3+i*.075,t0+.6+i*.075);if(appear<=0)continue;const v=1e-4*Math.pow(2,i)/maxH,hh=Math.max(2,(base-top)*v*eOut(appear));
    const last=i>32;ctx.save();ctx.globalAlpha=a;ctx.fillStyle=last&&hl>0?mixc('#3b6cff','#ffd21f',hl):'#3b6cff';if(last&&hl>0){ctx.shadowColor='#ffc400';ctx.shadowBlur=20*hl;}
    ctx.fillRect(x0+(i-1)*bw+3,base-hh,bw-6,hh);ctx.restore();}
  ctx.save();ctx.globalAlpha=a*.4;ctx.strokeStyle='#9fb0d8';ctx.beginPath();ctx.moveTo(x0,base+.5);ctx.lineTo(x1,base+.5);ctx.stroke();ctx.restore();
  [1,10,20,32,42].forEach(i=>T(String(i),x0+(i-.5)*bw,base+28,22,{a:a*.7,color:'#9fb0d8',weight:500}));
  const b1=seg(t,bar(16),bar(16)+.5);ctx.save();ctx.globalAlpha=a*b1;ctx.strokeStyle='#9fb0d8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x0,base+56);ctx.lineTo(x0,base+66);ctx.lineTo(x0+32*bw,base+66);ctx.lineTo(x0+32*bw,base+56);ctx.stroke();ctx.restore();
  T('前 32 次：约 430 公里，在图上几乎看不见',x0+16*bw,base+92,30,{a:a*b1,color:'#c9d4f0',weight:700});
  pop(t,bar(18),W/2-240,330,k=>{T('最后 10 次',W/2-240,320,76,{a:a*hl,color:YEL,weight:900,glow:24,glowColor:'rgba(255,200,0,.5)'});T('走完了 99.9% 的路',W/2-240,410,52,{a:a*hl,color:'#fff',weight:900});},.35);
  const A2=seg(t,bar(19)+.1,bar(19)+.5)*(1-seg(t,bar(22)-.2,bar(22)));
  T('每折一次，新增的厚度 = 之前的全部',W/2-240,520,40,{a:a*A2,color:'#c9d4f0',weight:700});
